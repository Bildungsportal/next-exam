site_name: Next-Exam Handbuch
site_url: https://bildungsportal.github.io/next-exam/
site_description: Handbuch für die Next-Exam Prüfungsumgebung (Version 2.0.0)
site_author: Next-Exam Team
docs_dir: docs
site_dir: site

theme:
  name: material
  language: de
  custom_dir: overrides
  favicon: img/favicon.png
  logo: img/favicon.png
  palette:
    - scheme: default
      primary: blue grey
      accent: green
      toggle:
        icon: material/brightness-7
        name: Dunkelmodus aktivieren
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Hellmodus aktivieren
  features:
    - toc.integrate
    - navigation.instant
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  hide:
    - navigation

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true   

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      toc_depth: 2

nav:
  - Startseite: index.md
  - Für Lehrkräfte: teacher.md
  - Prüfungsmodi: modes.md
  - Für Schüler:innen: student.md
  - Bildungsportal: bildungsportal.md
  - Administration: admin.md
  - Troubleshooting: issues.md

