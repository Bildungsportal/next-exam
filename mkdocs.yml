site_name: Next-Exam Handbuch
site_url: https://bildungsportal.github.io/next-exam/
site_description: Handbuch für die Next-Exam Prüfungsumgebung (Version 2.0.0)
site_author: Next-Exam Team
docs_dir: docs
site_dir: site

theme:
  name: material
  language: de
  custom_dir: overrides
  favicon: img/favicon.png
  logo: img/favicon.png
  palette:
    - scheme: default
      primary: blue grey
      accent: green
      toggle:
        icon: material/brightness-7
        name: Dunkelmodus aktivieren
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Hellmodus aktivieren
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true   

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences

nav:
  - Startseite: index.md
  - Quickstart: quickstart.md
  - Teacher: teacher.md
  - Student: student.md
  - Prüfungsmodi:
    - Mathematik (GeoGebra): modes/mathematik.md
    - Sprachen (Texteditor): modes/sprachen.md
    - Active Sheets: modes/activesheets.md
    - Online-Modi: modes/online.md
    - RDP: modes/rdp.md
    - Lokale VM: modes/localvm.md
  - Erweiterte Funktionen: advanced.md
  - Bildungsportal: bildungsportal.md
  - Kiosk-Modus: modes/kiosk.md
  - FAQ: faq.md
  - Bekannte Probleme: issues.md
  - Datenschutzrichtlinie: privacy-policy.md
