name: Build Windows x64 Portable EXE

on:
  workflow_call:
  workflow_dispatch: {}

# opt in to Node 24 runtime for js actions (default from 2026-06-16); pre-validate
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  id-token: write                # OIDC token for Azure Trusted Signing
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026
    environment: release         # must match the federated credential subject
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Inject production secrets into .env.production
        shell: pwsh
        env:
          NEXT_EXAM_API_SECRET: ${{ secrets.NEXT_EXAM_API_SECRET }}
          CONNECTION_SECRET: ${{ secrets.CONNECTION_SECRET }}
        run: |
          if ([string]::IsNullOrEmpty($env:NEXT_EXAM_API_SECRET) -or [string]::IsNullOrEmpty($env:CONNECTION_SECRET)) {
            throw "Missing NEXT_EXAM_API_SECRET or CONNECTION_SECRET"
          }
          foreach ($envFile in @("student/.env.production", "teacher/.env.production")) {
            (Get-Content $envFile) `
              -replace "^NEXT_EXAM_API_SECRET=.*", "NEXT_EXAM_API_SECRET=$($env:NEXT_EXAM_API_SECRET)" `
              -replace "^CONNECTION_SECRET=.*", "CONNECTION_SECRET=$($env:CONNECTION_SECRET)" | Set-Content $envFile
          }
        
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # electron-builder's Invoke-TrustedSigning authenticates via Azure.Identity EnvironmentCredential,
      # which needs the federated token on disk plus the matching env vars
      - name: Set Azure credential env for electron-builder
        shell: pwsh
        run: |
          "AZURE_CLIENT_ID=${{ secrets.AZURE_CLIENT_ID }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AZURE_TENANT_ID=${{ secrets.AZURE_TENANT_ID }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AZURE_FEDERATED_TOKEN_FILE=$(Join-Path $env:RUNNER_TEMP 'azure-federated-token.txt')" | Out-File -FilePath $env:GITHUB_ENV -Append


      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          
          
      - name: Teacher cache dependencies
        uses: actions/cache@v4
        with:
          path: ./teacher/node_modules
          key: ${{ runner.os }}-node-t-${{ hashFiles('./teacher/**/package-lock.json') }}
          
      - name: Teacher install dependencies
        working-directory: ./teacher
        run: |
          npm install
          mkdir dist
          
      # OIDC assertions expire after ~5 min, so refresh immediately before each build signs
      - name: Refresh Azure federated token (teacher)
        shell: pwsh
        run: |
          $token = (Invoke-RestMethod -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" `
            -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }).value
          Set-Content -Path $env:AZURE_FEDERATED_TOKEN_FILE -Value $token -NoNewline

      - name: Teacher build
        working-directory: ./teacher
        run: npm run build:win:portable
        
      - name: Upload Teacher Windows x64 Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: next-exam-teacher-windows-x64-portable-exe
          path: ./teacher/dist/electron/Packaged/Next-Exam-Teacher*x64.exe
          retention-days: 5
          
          
      - name: Student cache dependencies
        uses: actions/cache@v4
        with:
          path: ./student/node_modules
          key: ${{ runner.os }}-node-s-${{ hashFiles('./student/**/package-lock.json') }}
          
      - name: Student install dependencies
        working-directory: ./student
        run: |
          npm install
          mkdir dist
          
      # OIDC assertions expire after ~5 min, so refresh immediately before each build signs
      - name: Refresh Azure federated token (student)
        shell: pwsh
        run: |
          $token = (Invoke-RestMethod -Uri "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" `
            -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }).value
          Set-Content -Path $env:AZURE_FEDERATED_TOKEN_FILE -Value $token -NoNewline

      - name: Student build
        working-directory: ./student
        run: npm run build:win:portable
        
      - name: Upload Student Windows x64 Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: next-exam-student-windows-x64-portable-exe
          path: ./student/dist/electron/Packaged/Next-Exam-Student*x64.exe
          retention-days: 5
