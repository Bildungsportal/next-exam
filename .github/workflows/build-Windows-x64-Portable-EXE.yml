name: Build Windows x64 Portable EXE

on:
  workflow_call:
    inputs:
      prerelease:
        type: boolean
        required: false
        default: false
  workflow_dispatch: {}

# opt in to Node 24 runtime for js actions (default from 2026-06-16); pre-validate
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout This Repository
        if: ${{ inputs.prerelease == false }}
        uses: actions/checkout@v4

      - name: Checkout Private Repository
        if: ${{ inputs.prerelease == true }}
        uses: actions/checkout@v4
        with:
          repository: BiP-org/next-exam
          ref: main
          token: ${{ secrets.PAT_BiP_ORG_NEXT_EXAM }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'

      - name: Student cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ./student/.npm
            ./student/node_modules
          key: ${{ runner.os }}-node-s-${{ hashFiles('./student/**/package-lock.json') }}

      - name: Student install dependencies
        working-directory: ./student
        run: |
          npm install
          mkdir dist

      # Faster CI: no code signing (SIGN=false in quasar.config.ts); teacher portable is built in MSI workflow
      - name: Student build
        working-directory: ./student
        env:
          SIGN: "false"
        run: npm run build:win:portable

      - name: Upload Student Windows x64 Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: next-exam-student-windows-x64-portable-exe
          path: ./student/dist/electron/Packaged/Next-Exam-Student*x64.exe
          retention-days: 5
