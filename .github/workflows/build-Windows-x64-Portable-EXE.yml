name: Build Windows x64 Portable EXE

on:
  workflow_call:
  workflow_dispatch: {}

# opt in to Node 24 runtime for js actions (default from 2026-06-16); pre-validate
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Inject production secrets into .env.production
        shell: pwsh
        env:
          NEXT_EXAM_API_SECRET: ${{ secrets.NEXT_EXAM_API_SECRET }}
          CONNECTION_SECRET: ${{ secrets.CONNECTION_SECRET }}
        run: |
          if ([string]::IsNullOrEmpty($env:NEXT_EXAM_API_SECRET) -or [string]::IsNullOrEmpty($env:CONNECTION_SECRET)) {
            throw "Missing NEXT_EXAM_API_SECRET or CONNECTION_SECRET"
          }
          foreach ($envFile in @("student/.env.production", "teacher/.env.production")) {
            (Get-Content $envFile) `
              -replace "^NEXT_EXAM_API_SECRET=.*", "NEXT_EXAM_API_SECRET=$($env:NEXT_EXAM_API_SECRET)" `
              -replace "^CONNECTION_SECRET=.*", "CONNECTION_SECRET=$($env:CONNECTION_SECRET)" | Set-Content $envFile
          }
        
      - name: Decode .p12 file
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
        run: |
          [System.IO.File]::WriteAllBytes('./certificate.p12', [System.Convert]::FromBase64String($env:P12_BASE64))
  
  
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          
          
      - name: Teacher cache dependencies
        uses: actions/cache@v4
        with:
          path: ./teacher/node_modules
          key: ${{ runner.os }}-node-t-${{ hashFiles('./teacher/**/package-lock.json') }}
          
      - name: Teacher install dependencies
        working-directory: ./teacher
        run: |
          npm install
          mkdir dist
          
      - name: Teacher build
        working-directory: ./teacher
        env:
          CSC_LINK: "file://../certificate.p12"
          CSC_KEY_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: npm run build:win:portable
        
      - name: Upload Teacher Windows x64 Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: next-exam-teacher-windows-x64-portable-exe
          path: ./teacher/dist/electron/Packaged/Next-Exam-Teacher*x64.exe
          retention-days: 5
          
          
      - name: Student cache dependencies
        uses: actions/cache@v4
        with:
          path: ./student/node_modules
          key: ${{ runner.os }}-node-s-${{ hashFiles('./student/**/package-lock.json') }}
          
      - name: Student install dependencies
        working-directory: ./student
        run: |
          npm install
          mkdir dist
          
      - name: Student build
        working-directory: ./student
        env:
          CSC_LINK: "file://../certificate.p12"
          CSC_KEY_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: npm run build:win:portable
        
      - name: Upload Student Windows x64 Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: next-exam-student-windows-x64-portable-exe
          path: ./student/dist/electron/Packaged/Next-Exam-Student*x64.exe
          retention-days: 5
