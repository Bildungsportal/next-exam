name: Build Linux x64 AppImage

on:
  workflow_call:
  workflow_dispatch: {}

# opt in to Node 24 runtime for js actions (default from 2026-06-16); pre-validate
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Inject production secrets into .env.production
        env:
          NEXT_EXAM_API_SECRET: ${{ secrets.NEXT_EXAM_API_SECRET }}
          CONNECTION_SECRET: ${{ secrets.CONNECTION_SECRET }}
        run: |
          if [ -z "$NEXT_EXAM_API_SECRET" ] || [ -z "$CONNECTION_SECRET" ]; then
            echo "Missing NEXT_EXAM_API_SECRET or CONNECTION_SECRET" >&2
            exit 1
          fi
          for ENV_FILE in student/.env.production teacher/.env.production; do
            sed -i "s/^NEXT_EXAM_API_SECRET=.*/NEXT_EXAM_API_SECRET=${NEXT_EXAM_API_SECRET}/" "$ENV_FILE"
            sed -i "s/^CONNECTION_SECRET=.*/CONNECTION_SECRET=${CONNECTION_SECRET}/" "$ENV_FILE"
          done
      
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
  
  
      - name: Teacher cache dependencies
        uses: actions/cache@v4
        with:
          path: ./teacher/node_modules
          key: ${{ runner.os }}-node-t-${{ hashFiles('./teacher/**/package-lock.json') }}
          
      - name: Teacher install dependencies
        working-directory: ./teacher
        run: npm install
        
      - name: Clean electron-builder temp directories
        run: |
          rm -rf /tmp/t-* 2>/dev/null || true
          rm -rf ~/.cache/electron-builder 2>/dev/null || true
        
      - name: Teacher build
        working-directory: ./teacher
        env:
          USE_HARD_LINKS: "false"
          ELECTRON_BUILDER_DISABLE_LINKS: "true"
        run: npm run build:linux
        
      - name: Upload Teacher Linux x64 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: next-exam-teacher-linux-x64-appimage
          path: ./teacher/dist/electron/Packaged/Next-Exam-Teacher*x86_64.AppImage
          retention-days: 5
          
          
      - name: Student cache dependencies
        uses: actions/cache@v4
        with:
          path: ./student/node_modules
          key: ${{ runner.os }}-node-s-${{ hashFiles('./student/**/package-lock.json') }}
          
      - name: Student install dependencies
        working-directory: ./student
        run: npm install
        
      - name: Clean electron-builder temp directories
        run: |
          rm -rf /tmp/t-* 2>/dev/null || true
          rm -rf ~/.cache/electron-builder 2>/dev/null || true
        
      - name: Student build
        working-directory: ./student
        env:
          USE_HARD_LINKS: "false"
          ELECTRON_BUILDER_DISABLE_LINKS: "true"
        run: npm run build:linux
        
      - name: Upload Student Linux x64 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: next-exam-student-linux-x64-appimage
          path: ./student/dist/electron/Packaged/Next-Exam-Student*x86_64.AppImage
          retention-days: 5
