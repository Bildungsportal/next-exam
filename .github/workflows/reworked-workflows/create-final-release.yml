name: Final Release

on:
  workflow_call: { }
  workflow_dispatch: { }

# opt in to Node 24 runtime for js actions (default from 2026-06-16); pre-validate
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# a newly dispatched release run supersedes and cancels a still-running one
concurrency:
  group: final-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    uses: ./.github/workflows/build-Linux-x64-AppImage.yml
    secrets: inherit
  macos-arm64:
    uses: ./.github/workflows/build-MacOS-arm64-DMG.yml
    secrets: inherit
  
  macos-x64-teacher:
    uses: ./.github/workflows/build-MacOS-x64-Teacher-DMG.yml
    secrets: inherit

  macos-x64-student:
    uses: ./.github/workflows/build-MacOS-x64-Student-DMG.yml
    secrets: inherit
  
  windows:
    uses: ./.github/workflows/build-Windows-x64.yml
    secrets: inherit

  ios:
    uses: ./.github/workflows/build-iOS-arm64-IPA.yml
    secrets: inherit


  release:
    needs: [linux, macos-arm64, macos-x64-teacher, macos-x64-student, windows, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
            fetch-depth: 0
          
      - name: Read version from .env.production
        id: version_reader
        run: |
          VERSION=$(grep '^VERSION=' student/.env.production | cut -d= -f2- | tr -d '"' | tr -d "'")
          BUILD_NUMBER=$(grep '^BUILD_NUMBER=' student/.env.production | cut -d= -f2- | tr -d '"' | tr -d "'")
          if [ -z "$VERSION" ] || [ -z "$BUILD_NUMBER" ]; then
            echo "ERROR: VERSION or BUILD_NUMBER missing in student/.env.production" >&2
            exit 1
          fi
          BUILD_VERSION="${VERSION}.${BUILD_NUMBER}"
          echo "Detected version: $BUILD_VERSION"
          NEW_TAG="v$BUILD_VERSION"
          echo "Release tag: $NEW_TAG"
          LAST_RELEASE_TAG=$(git tag --sort=-v:refname | grep "^v[0-9]" | head -n 1)
          echo "Previous release tag: $LAST_RELEASE_TAG"
          echo "new_release_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "last_release_tag=$LAST_RELEASE_TAG" >> "$GITHUB_OUTPUT"

#      - name: Guard on build success before tagging
